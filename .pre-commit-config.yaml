default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies: [Flake8-pyproject]

  - repo: local
    hooks:
      - id: uv-lock
        name: uv-lock
        entry: uv lock
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: pylock
        name: pylock
        entry: uv export --frozen --format pylock.toml -o pylock.toml
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|pylock\.toml)$

      - id: pip-audit
        name: pip-audit
        entry: pip-audit --locked .
        language: system
        pass_filenames: false
        files: ^pylock\.toml$

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: \.py$

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        files: \.py$
