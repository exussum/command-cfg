[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "command-cfg"
version = "0.5.0"
requires-python = ">=3.14"
dependencies = [
    "docopt-ng>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest",
    "black",
    "isort",
    "mypy",
    "pyflakes",
]

[tool.black]
line-length = 140
target-version = ["py314"]

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 140
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.14"
files = ["src/command_cfg"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/command_cfg"]
