[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "command-cfg"
version = "0.6.0"
requires-python = ">=3.14"
dependencies = [
    "docopt-ng>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 140
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["src/command_cfg"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/command_cfg"]
